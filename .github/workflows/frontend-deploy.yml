name: 프론트엔드 GitOps 배포

on:
  workflow_run:
    workflows:
      - 프론트엔드 컨테이너 이미지 빌드 및 푸시
    types:
      - completed
    branches:
      - main

jobs:
  update-gitops:
    name: GitOps 이미지 버전 갱신

    if: >
      github.repository == 'The-Robinsons/damara-FE' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: GitOps 저장소 가져오기
        uses: actions/checkout@v7
        with:
          repository: The-Robinsons/damara-infra
          ref: main
          token: ${{ secrets.DAMARA_INFRA_TOKEN }}

      - name: 프론트엔드 이미지 버전 갱신
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sed -i -E \
            "s#(image: ghcr.io/the-robinsons/damara-fe:)[^[:space:]]+#\1${IMAGE_SHA}#" \
            k8s/apps/damara/frontend.yaml

          grep "image: ghcr.io/the-robinsons/damara-fe:" \
            k8s/apps/damara/frontend.yaml

      - name: 변경 사항 커밋 및 푸시
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git diff --quiet; then
            echo "이미 동일한 이미지 버전이 적용되어 있음"
            exit 0
          fi

          git config user.name "damara-cd"
          git config user.email "damara-cd@users.noreply.github.com"

          git add k8s/apps/damara/frontend.yaml
          git commit -m "deploy: update damara-fe image to ${IMAGE_SHA}"
          git push origin main
