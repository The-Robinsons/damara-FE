name: 프론트엔드 품질 검사

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 타입·린트·테스트·E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 정적 품질 검사
        run: npm run check

      - name: 핵심 브라우저 흐름 검사
        run: npm run test:e2e
