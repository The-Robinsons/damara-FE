name: 프론트엔드 컨테이너 이미지 빌드 및 푸시

on:
  workflow_run:
    workflows:
      - 프론트엔드 품질 검사
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: the-robinsons/damara-fe

jobs:
  build-and-push:
    name: Docker 이미지 빌드 및 GHCR 푸시

    # 1. 원본 저장소에서만
    # 2. 품질 검사가 성공했을 때만
    # 3. PR 검사가 아니라 main push로 실행된 품질 검사일 때만
    if: >
      github.repository == 'The-Robinsons/damara-FE' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
